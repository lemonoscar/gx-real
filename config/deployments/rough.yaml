schema_version: 1
deployment_kind: rough
policy_default: policies/rough/current/policy.onnx
artifact_manifest_default: policies/rough/current/artifact_manifest.yaml
height_observation:
  mode: live_elevation_map
  dimension: 187
  slice: [66, 253]
  create_provider: true
  production_source: height_map_array
  contract_default: policies/rough/current/height_scan_contract.yaml
  topic_default: /utlidar/height_map_array
  pose_topic_default: /utlidar/robot_pose
  layer_default: ""
  min_valid_ratio: 0.95
  min_raw_valid_ratio: 0.55
  min_critical_valid_ratio: 0.95
  max_critical_sentinel_cells: 0
  controlled_plane_completion: true
  height_cache_max_age_sec: 0.50
  required_consecutive_valid_frames: 5
  require_source_stamp: true
  max_pose_map_skew_sec: 0.03
arm_observation:
  mode: fixed_hold
  joint_pose: [0.0, 0.3, 0.5, 0.0, 0.0, 0.0]
  gripper_target: 0.0
  required_source: x5_fixed_hold
  max_tracking_error_rad: 0.10
leg_reference:
  offset_mode: training_default
  allow_live_ready_pose_calibration: false
